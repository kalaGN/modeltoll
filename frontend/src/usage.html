<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>调用统计 · Laya 模型 API 平台</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="console-page" data-page="usage">
<a class="skip-link" href="#main-content">跳转到主要内容</a>
<div class="console-shell">
  <aside class="console-sidebar">
    <a href="/keys" class="brand" aria-label="Laya 首页">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M10 1 2 12v11l8 8 8-8V12Z" fill="currentColor"/><path d="M19 21h11v10H19Z" fill="currentColor"/></svg>
      <span><strong>Laya</strong><small>模型 API 平台</small></span>
    </a>
    <nav class="console-nav" aria-label="主要导航">
      <a href="/keys" class="nav-link">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8 2 2-2 2 2 2-3 3-2-2-2 2"/></svg>
        API Key 管理</a>
      <a href="/usage" class="nav-link is-active" aria-current="page">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
        调用统计</a>
      <a href="/billing" class="nav-link">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        费用统计</a>
    </nav>
    <div class="account-panel">
      <span class="account-avatar" aria-hidden="true">@</span>
      <span id="account" class="flex-1 truncate">加载中…</span>
      <button id="logout" class="text-xs text-[#62695e] hover:text-[#344b2d]">退出</button>
    </div>
  </aside>

  <div class="console-workspace">

    <main id="main-content" class="console-main">
      <div>
        <h1 class="page-title">调用统计</h1>
        <p class="mt-1 text-sm text-[#62695e]">查看当前账号名下的模型调用记录与趋势。</p>
      </div>

      <section class="filter-panel" aria-label="筛选记录">
        <span class="text-sm">
          <span class="mb-1.5 block text-[13px] text-[#62695e]">时间范围（UTC，留空取最近 30 天）</span>
          <span class="flex items-center gap-2">
            <input id="date-from" type="date" aria-label="开始日期（UTC）" class="rounded-lg border border-[#dddfd7] bg-white px-3 py-2 text-sm outline-none focus:border-[#344b2d]">
            <span class="text-xs text-[#62695e]">至</span>
            <input id="date-to" type="date" aria-label="结束日期（UTC）" class="rounded-lg border border-[#dddfd7] bg-white px-3 py-2 text-sm outline-none focus:border-[#344b2d]">
          </span>
        </span>
        <label class="text-sm">
          <span class="mb-1.5 block text-[13px] text-[#62695e]">API Key</span>
          <select id="key-filter" class="w-56 rounded-lg border border-[#dddfd7] bg-white px-3 py-2 text-sm outline-none focus:border-[#344b2d]">
            <option value="">全部 API Key</option>
          </select>
        </label>
        <label class="text-sm">
          <span class="mb-1.5 block text-[13px] text-[#62695e]">接口</span>
          <select id="endpoint-filter" class="w-64 rounded-lg border border-[#dddfd7] bg-white px-3 py-2 text-sm outline-none focus:border-[#344b2d]"></select>
        </label>
        <button id="apply" class="button-primary">查询</button>
        <span id="range" class="ml-auto pb-2 text-xs text-[#687064]"></span>
      </section>

      <div id="error" role="alert" class="hidden rounded-xl border border-[#fecaca] bg-[#fee2e2] px-4 py-3 text-sm text-[#b42318]"></div>

      <section class="metric-grid sm:grid-cols-2 lg:grid-cols-4" aria-label="关键指标">
        <div class="metric">
          <span class="block text-xs text-[#62695e]">调用总量</span>
          <span id="stat-calls" class="mt-1.5 block text-[26px] font-bold leading-tight">—</span>
        </div>
        <div class="metric">
          <span class="block text-xs text-[#62695e]">成功调用</span>
          <span id="stat-succeeded" class="mt-1.5 block text-[26px] font-bold leading-tight text-[#28743e]">—</span>
        </div>
        <div class="metric">
          <span class="block text-xs text-[#62695e]">失败调用</span>
          <span id="stat-failed" class="mt-1.5 block text-[26px] font-bold leading-tight text-[#b42318]">—</span>
        </div>
        <div class="metric">
          <span class="block text-xs text-[#62695e]">输入 Token</span>
          <span id="stat-tokens" class="mt-1.5 block text-[26px] font-bold leading-tight">—</span>
        </div>
      </section>

      <section class="console-panel">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-semibold">调用趋势</h2>
          <span class="text-xs text-[#687064]">按 UTC 日期分桶，仅用于趋势展示</span>
        </div>
        <svg id="chart" class="mt-4 block h-45 w-full" role="img" aria-label="调用趋势折线图"></svg>
        <p class="mt-2 text-xs text-[#62695e]">
          进行中 <span id="in-progress">0</span> 次 · 计费待确认 <span id="pending">0</span> 笔
        </p>
      </section>

      <section class="console-panel">
        <h2 class="text-lg font-semibold">调用明细</h2>
        <div class="table-scroll" tabindex="0" role="region" aria-label="明细表，可横向滚动">
          <table class="records-table">
            <thead class="bg-[#f5f6f0] text-[13px] text-[#62695e]">
              <tr>
                <th class="px-3 py-2 font-medium">请求标识</th>
                <th class="px-3 py-2 font-medium">API Key</th>
                <th class="px-3 py-2 font-medium">接口</th>
                <th class="px-3 py-2 font-medium">时间（UTC）</th>
                <th class="px-3 py-2 font-medium">状态</th>
                <th class="px-3 py-2 font-medium">输入 Token</th>
                <th class="px-3 py-2 font-medium">耗时</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="mt-4 flex items-center justify-between text-sm">
          <span id="page-info" class="text-[#62695e]"></span>
          <span class="flex gap-3">
            <button id="prev" class="rounded-lg border border-[#dddfd7] px-4 py-1.5 hover:bg-[#f5f6f0] disabled:cursor-not-allowed disabled:opacity-40">上一页</button>
            <button id="next" class="rounded-lg border border-[#dddfd7] px-4 py-1.5 hover:bg-[#f5f6f0] disabled:cursor-not-allowed disabled:opacity-40">下一页</button>
            <select id="page-size" class="rounded-lg border border-[#dddfd7] bg-white px-2 py-1.5 text-sm outline-none focus:border-[#344b2d]" aria-label="每页条数">
              <option value="20">20 条/页</option>
              <option value="50">50 条/页</option>
              <option value="100">100 条/页</option>
            </select>
          </span>
        </div>
      </section>

      <p class="pb-4 text-center text-xs text-[#62695e]">统计与明细来自服务端同一时间窗口的真实记录，密钥只显示脱敏标识。</p>
    </main>
  </div>
</div>
<script src="/assets/app.js"></script>
<script src="/assets/branding.js"></script>
</body>
</html>
