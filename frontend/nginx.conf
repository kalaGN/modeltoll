pid /tmp/nginx.pid;
worker_processes auto;
error_log stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    client_max_body_size 0;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_next_upstream off;
    proxy_cache off;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;
        location = /healthz { return 200 "ok\n"; }
        location /v1/ { proxy_pass http://app:8000; }
        location = /health { proxy_pass http://app:8000; }
        location = /docs { proxy_pass http://app:8000; }
        location = /docs/oauth2-redirect { proxy_pass http://app:8000; }
        location = /redoc { proxy_pass http://app:8000; }
        location = /openapi.json { proxy_pass http://app:8000; }
        # Exact locations avoid serving templates under arbitrary URL aliases.
        location = / { try_files /index.html =404; add_header Cache-Control no-store; }
        location = /login { try_files /login.html =404; add_header Cache-Control no-store; }
        location = /register { try_files /login.html =404; add_header Cache-Control no-store; }
        location = /keys { try_files /api-keys.html =404; add_header Cache-Control no-store; }
        location = /usage { try_files /usage.html =404; add_header Cache-Control no-store; }
        location = /billing { try_files /billing.html =404; add_header Cache-Control no-store; }
        location = /admin { try_files /admin.html =404; add_header Cache-Control no-store; }
        location = /admin/settings { try_files /admin-settings.html =404; add_header Cache-Control no-store; }
        location = /admin/users { try_files /admin-users.html =404; add_header Cache-Control no-store; }
        location ~ ^/assets/(.+\.(?:js|css|svg|png|jpe?g|webp))$ {
            alias /usr/share/nginx/html/$1;
            add_header Cache-Control no-cache;
            add_header X-Content-Type-Options nosniff always;
        }
        location / { return 404; }
    }
}
