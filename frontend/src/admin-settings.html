<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>平台配置 · Laya</title><link rel="stylesheet" href="/assets/app.css"></head>
<body class="console-page" data-page="admin-settings"><a class="skip-link" href="#main-content">跳转到主要内容</a><div class="console-shell">  <aside class="console-sidebar">
    <a href="/admin" class="brand" aria-label="Laya 首页">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M10 1 2 12v11l8 8 8-8V12Z" fill="currentColor"/><path d="M19 21h11v10H19Z" fill="currentColor"/></svg>
      <span><strong>Laya</strong><small>模型 API 平台</small></span>
    </a>
    <nav class="console-nav" aria-label="管理导航">
      <a href="/admin" class="nav-link ">平台总览</a>
      <a href="/admin/settings" class="nav-link is-active" aria-current="page">平台配置</a>
    </nav>
    <div class="account-panel">
      <span class="account-avatar" aria-hidden="true">@</span>
      <span id="account" class="flex-1 truncate">加载中…</span>
      <button id="logout" class="text-xs text-[#62695e] hover:text-[#344b2d]">退出</button>
    </div>
  </aside>

<div class="console-workspace"><main id="main-content" class="console-main"><div class="page-heading"><div><h1 class="page-title">平台配置</h1><p class="text-sm text-[#62695e]">统一平台名称、Logo 与品牌简介。</p></div><div class="heading-actions"><a href="/keys" class="button-secondary console-switch">⇄ 切换到个人控制台</a></div></div>
<div id="error" class="modal-error hidden" role="alert"></div>
<div class="settings-layout"><section class="console-panel"><h2>品牌信息</h2><form id="settings-form" class="settings-form"><label for="platform-name">平台名称<input id="platform-name" class="settings-input" maxlength="60" required placeholder="请输入平台名称"></label><label for="platform-description">平台简介<textarea id="platform-description" class="settings-input" maxlength="200" rows="3" placeholder="简短介绍你的平台"></textarea></label>
<div><label for="platform-logo">平台 Logo</label><div class="logo-picker"><div id="current-logo" class="logo-thumbnail" aria-label="当前 Logo"><span>默认</span><img id="logo-thumbnail" hidden alt="Logo 预览"></div><div><input id="platform-logo" type="file" accept="image/png,image/jpeg,image/webp"><p class="settings-help">PNG、JPEG、WebP，最大 2 MB，尺寸不超过 4096 × 4096。</p><button id="reset-logo" type="button" class="button-secondary">恢复默认 Logo</button></div></div></div>
<p id="settings-status" role="status" class="settings-help">正在读取配置…</p><div class="settings-actions"><button id="save-settings" type="submit" class="button-primary" disabled>保存配置</button></div></form></section>
<section class="console-panel brand-preview-panel"><h2>品牌预览</h2><p class="settings-help">仅预览未保存的修改。</p><div class="brand-preview"><span id="preview-default" class="preview-default">◆</span><img id="preview-logo" hidden alt="品牌 Logo 预览"><strong id="preview-name">Laya</strong><p id="preview-description">模型 API 平台</p></div><p class="settings-help">保存后，刷新登录页及各控制台即可看到新的品牌。</p></section></div></main></div></div>
<script src="/assets/branding.js"></script><script src="/assets/admin.js"></script><script src="/assets/app.js"></script></body></html>
