<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · Laya 模型 API 平台</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body class="login-page">
<div class="login-layout">

  <section class="login-brand">
    <a href="/login" class="brand" aria-label="Laya 登录">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M10 1 2 12v11l8 8 8-8V12Z" fill="currentColor"/><path d="M19 21h11v10H19Z" fill="currentColor"/></svg>
      <span><strong>Laya</strong><small>模型 API 平台</small></span>
    </a>
    <div class="login-statement"><h1>让每一次调用，<br>都清晰<span>可见。</span></h1>
      <p>从一枚密钥开始。<br>连接模型，掌握用量，看清成本。</p>
    </div>
    <div class="signal-art" aria-hidden="true"><svg viewBox="0 0 600 240" fill="none"><path d="M0 180h100l60-120 80 150 75-170 70 130h215" stroke="currentColor" stroke-width="2"/><circle cx="315" cy="40" r="12" fill="currentColor"/><path d="M0 220h600M0 100h600M100 0v240M300 0v240M500 0v240" stroke="currentColor" opacity=".13"/></svg></div>
    <div class="login-capabilities"><span><b>01</b> 密钥管理</span><span><b>02</b> 调用追踪</span><span><b>03</b> 费用明细</span></div>
  </section>

  <!-- 右侧表单区 -->
  <section class="login-form-panel">

    <div class="w-full max-w-[380px]">
      <h2 id="title" class="text-center text-[34px] font-bold tracking-tight">欢迎回来</h2>
      <p id="subtitle" class="mb-10 mt-3.5 text-center text-[15px] text-slate-500">使用邮箱和密码登录 Laya。</p>

      <div id="alert" role="alert" class="mb-5 hidden rounded-[10px] border px-3.5 py-3 text-[13.5px] leading-relaxed"></div>

      <form id="form" novalidate>
        <div class="mb-5">
          <label for="email" class="mb-2.5 block text-sm font-semibold">邮箱地址</label>
          <div class="relative">
            <span class="pointer-events-none absolute left-3.5 top-1/2 grid -translate-y-1/2 place-items-center text-slate-400">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m2 7 10 6 10-6"/></svg>
            </span>
            <input id="email" name="email" type="email" placeholder="name@example.com"
                   autocomplete="username" required
                   class="w-full rounded-xl border border-slate-200 bg-white py-[15px] pl-11 pr-11 text-[15px] outline-none transition placeholder:text-slate-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/12 aria-[invalid=true]:border-red-600">
          </div>
        </div>

        <div class="mb-5">
          <label for="password" class="mb-2.5 block text-sm font-semibold">密码</label>
          <div class="relative">
            <span class="pointer-events-none absolute left-3.5 top-1/2 grid -translate-y-1/2 place-items-center text-slate-400">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            </span>
            <input id="password" name="password" type="password" placeholder="请输入密码"
                   autocomplete="current-password" required
                   class="w-full rounded-xl border border-slate-200 bg-white py-[15px] pl-11 pr-11 text-[15px] outline-none transition placeholder:text-slate-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/12 aria-[invalid=true]:border-red-600">
            <button class="absolute right-2 top-1/2 grid -translate-y-1/2 place-items-center rounded-lg p-2 text-slate-400 hover:bg-slate-50 hover:text-slate-500"
                    type="button" id="reveal" aria-label="显示密码" aria-pressed="false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <p id="modeHint" class="mb-5 -mt-2 text-[13px] text-slate-500">请使用已有账号登录。</p>
        <button type="submit" id="submit"
                class="w-full rounded-xl bg-brand-500 py-4 text-base font-semibold text-white transition hover:bg-brand-600 disabled:cursor-not-allowed disabled:bg-brand-200">
          登录
        </button>
      </form>

      <p id="switch" class="mt-6 text-center text-sm text-slate-500">
        还没有账号？<a href="/register" class="font-semibold text-brand-500 hover:underline">注册新邮箱</a>
      </p>
      <p class="mt-9 flex items-center justify-center gap-2 text-[13px] text-slate-500">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        完整 API Key 仅在创建时展示一次。
      </p>
      <footer class="mt-12 text-center text-[12.5px] text-slate-400">
        Laya &copy; 2026. 保留所有权利。
      </footer>
    </div>
  </section>
</div>

<script>
  const form = document.getElementById("form");
  const alertBox = document.getElementById("alert");
  const submit = document.getElementById("submit");
  const email = document.getElementById("email");
  const password = document.getElementById("password");
  const params = new URLSearchParams(location.search);
  const mode = params.get("mode") === "register" || location.pathname === "/register";

  function readCookie(name) {
    const prefix = name + "=";
    return document.cookie
      .split("; ")
      .find((row) => row.startsWith(prefix))
      ?.slice(prefix.length) ?? "";
  }

  if (mode) {
    document.getElementById("title").textContent = "创建账号";
    document.getElementById("subtitle").textContent = "注册后即可登录 Laya 模型 API 平台。";
    document.getElementById("modeHint").textContent = "密码长度需为 8–128 个字符。";
    submit.textContent = "注册";
    password.setAttribute("autocomplete", "new-password");
    document.getElementById("switch").innerHTML =
      '已有账号？<a href="/login" class="font-semibold text-brand-500 hover:underline">直接登录</a>';
  }

  document.getElementById("reveal").addEventListener("click", function () {
    const shown = password.type === "text";
    password.type = shown ? "password" : "text";
    this.setAttribute("aria-pressed", String(!shown));
    this.setAttribute("aria-label", shown ? "显示密码" : "隐藏密码");
  });

  function show(kind, message) {
    alertBox.textContent = message;
    alertBox.className =
      "mb-5 rounded-[10px] border px-3.5 py-3 text-[13.5px] leading-relaxed " +
      (kind === "error"
        ? "border-red-200 bg-red-50 text-red-700"
        : "border-green-200 bg-green-50 text-green-700");
  }

  function hideAlert() {
    alertBox.className = "mb-5 hidden rounded-[10px] border px-3.5 py-3 text-[13.5px]";
  }

  if (params.has("registered")) show("success", "注册成功，请使用新账号登录。");

  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    hideAlert();
    [email, password].forEach((el) => el.setAttribute("aria-invalid", "false"));
    if (!email.value.trim() || !password.value) {
      show("error", "请填写邮箱和密码。");
      return;
    }
    const csrfToken = readCookie("laya_csrf");
    if (!csrfToken) {
      show("error", "缺少 CSRF 令牌，请刷新页面后重试。");
      return;
    }
    submit.disabled = true;
    submit.textContent = mode ? "注册中…" : "登录中…";
    try {
      const response = await fetch(mode ? "/v1/auth/register" : "/v1/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken },
        credentials: "same-origin",
        body: JSON.stringify({ email: email.value, password: password.value }),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        submit.disabled = false;
        submit.textContent = mode ? "注册" : "登录";
        let message = data.message;
        if (response.status === 422) {
          const detail = data.detail;
          message = Array.isArray(detail)
            ? `输入有误：${detail.map((i) => i.msg).filter(Boolean).join("；")}`
            : String(detail || "输入有误");
          if (Array.isArray(detail)) {
            detail.forEach((item) => {
              if (item.loc?.includes("password")) password.setAttribute("aria-invalid", "true");
              if (item.loc?.includes("email")) email.setAttribute("aria-invalid", "true");
            });
          }
        }
        show("error", message || "请求失败，请稍后重试。");
        return;
      }
      location.href = mode ? "/login?registered=1" : "/keys";
    } catch (error) {
      submit.disabled = false;
      submit.textContent = mode ? "注册" : "登录";
      show("error", "无法连接服务，请确认服务已启动。");
    }
  });
</script>
</body>
</html>
