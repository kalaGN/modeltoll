<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>平台总览 · Laya</title><link rel="stylesheet" href="/assets/app.css"></head>
<body class="console-page" data-page="admin"><a class="skip-link" href="#main-content">跳转到主要内容</a><div class="console-shell">  <aside class="console-sidebar">
    <a href="/admin" class="brand" aria-label="Laya 首页">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M10 1 2 12v11l8 8 8-8V12Z" fill="currentColor"/><path d="M19 21h11v10H19Z" fill="currentColor"/></svg>
      <span><strong>Laya</strong><small>模型 API 平台</small></span>
    </a>
    <nav class="console-nav" aria-label="管理导航">
      <a href="/admin" class="nav-link is-active" aria-current="page">平台总览</a>
      <a href="/admin/users" class="nav-link">用户与密钥</a>
      <a href="/admin/settings" class="nav-link ">平台配置</a>
    </nav>
    <div class="account-panel">
      <span class="account-avatar" aria-hidden="true">@</span>
      <span id="account" class="flex-1 truncate">加载中…</span>
      <button id="logout" class="text-xs text-[#62695e] hover:text-[#344b2d]">退出</button>
    </div>
  </aside>

<div class="console-workspace"><main id="main-content" class="console-main"><div class="page-heading"><div><h1 class="page-title">平台总览</h1><p class="text-sm text-[#62695e]">查看整个平台的账号、调用与费用。</p></div><div class="heading-actions"><a href="/keys" class="button-secondary console-switch">⇄ 切换到个人控制台</a><button id="admin-refresh" class="button-primary">刷新</button></div></div>
<form id="overview-filter" class="filter-panel"><label for="admin-from">开始日期（UTC）<input id="admin-from" type="date" required class="settings-input"></label><label for="admin-to">结束日期（UTC，含当日）<input id="admin-to" type="date" required class="settings-input"></label><button class="button-secondary" type="submit">应用时间范围</button><span id="overview-state" role="status">加载中…</span></form>
<div id="error" class="modal-error hidden" role="alert"></div>
<section class="metric-grid admin-metrics" aria-label="平台关键指标"><div class="metric"><span class="metric-label">账号总数</span><span id="stat-users">—</span><small>当前总量</small></div><div class="metric"><span class="metric-label">可用密钥</span><span id="stat-keys">—</span><small>当前总量</small></div><div class="metric"><span class="metric-label">调用次数</span><span id="stat-calls">—</span><small>所选时间范围</small></div><div class="metric"><span class="metric-label">调用费用</span><span id="stat-amount">—</span><small>所选时间范围 · 人民币</small></div></section>
<div class="admin-charts"><section class="console-panel"><div class="panel-heading"><h2>调用趋势</h2></div><svg id="admin-calls-chart" role="img" aria-label="每日调用次数"></svg></section><section class="console-panel"><div class="panel-heading"><h2>费用趋势</h2></div><svg id="admin-money-chart" role="img" aria-label="每日调用费用，人民币"></svg></section></div>
<section class="console-panel"><h2>每日数据</h2><div class="table-scroll" tabindex="0" role="region" aria-label="每日调用与费用"><table class="records-table"><thead><tr><th>日期（UTC）</th><th>调用次数</th><th>费用（人民币）</th></tr></thead><tbody id="admin-daily"></tbody></table></div></section>
<div class="safety-notice">费用仅统计已成功记账的调用，时间按 UTC 展示。账号和密钥为当前存量，调用及费用按所选时间统计。</div></main></div></div>
<script type="module" src="/assets/pages/admin/overview.js"></script>
</body></html>
