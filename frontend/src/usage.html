<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>调用统计 · Laya 模型 API 平台</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="bg-[#f5f7fa] text-[#111827]" data-page="usage">
<div class="flex min-h-screen">
  <aside class="flex w-[260px] shrink-0 flex-col border-r border-[#e5e7eb] bg-white">
    <div class="flex items-center gap-3 px-6 py-6">
      <span class="grid h-9 w-9 place-items-center rounded-lg bg-[#2563eb] font-bold text-white">L</span>
      <span><span class="block text-lg font-semibold">Laya</span>
      <span class="block text-xs text-[#6b7280]">模型 API 平台</span></span>
    </div>
    <nav class="flex-1 space-y-1 px-3">
      <a href="/keys" class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm text-[#374151] hover:bg-[#f3f4f6]">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8 2 2-2 2 2 2-3 3-2-2-2 2"/></svg>
        API Key 管理</a>
      <a href="/usage" class="flex items-center gap-3 rounded-lg bg-[#eff6ff] px-3 py-2 text-sm font-medium text-[#2563eb]">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
        调用统计</a>
      <a href="/billing" class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm text-[#374151] hover:bg-[#f3f4f6]">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        费用统计</a>
    </nav>
    <div class="flex items-center gap-3 border-t border-[#e5e7eb] px-5 py-4 text-sm text-[#374151]">
      <span class="grid h-8 w-8 place-items-center rounded-full bg-[#eff6ff] text-[#2563eb]">@</span>
      <span id="account" class="flex-1 truncate">加载中…</span>
      <button id="logout" class="text-xs text-[#6b7280] hover:text-[#2563eb]">退出</button>
    </div>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex h-14 items-center justify-between border-b border-[#e5e7eb] bg-white px-8">
      <span class="text-[15px] font-semibold">调用统计</span>
      <span class="grid h-8 w-8 place-items-center rounded-full bg-[#eff6ff] text-[#2563eb]">L</span>
    </header>

    <main class="mx-auto w-full max-w-[1120px] space-y-6 p-8">
      <div>
        <h1 class="text-[28px] font-bold">调用统计</h1>
        <p class="mt-1 text-sm text-[#6b7280]">查看当前账号名下的模型调用记录与趋势。</p>
      </div>

      <section class="flex flex-wrap items-end gap-4 rounded-xl border border-[#e5e7eb] bg-white p-5 shadow-sm">
        <span class="text-sm">
          <span class="mb-1.5 block text-[13px] text-[#6b7280]">时间范围（UTC，留空取最近 30 天）</span>
          <span class="flex items-center gap-2">
            <input id="date-from" type="date" class="rounded-lg border border-[#e5e7eb] bg-white px-3 py-2 text-sm outline-none focus:border-[#2563eb]">
            <span class="text-xs text-[#6b7280]">至</span>
            <input id="date-to" type="date" class="rounded-lg border border-[#e5e7eb] bg-white px-3 py-2 text-sm outline-none focus:border-[#2563eb]">
          </span>
        </span>
        <label class="text-sm">
          <span class="mb-1.5 block text-[13px] text-[#6b7280]">API Key</span>
          <select id="key-filter" class="w-56 rounded-lg border border-[#e5e7eb] bg-white px-3 py-2 text-sm outline-none focus:border-[#2563eb]">
            <option value="">全部 API Key</option>
          </select>
        </label>
        <label class="text-sm">
          <span class="mb-1.5 block text-[13px] text-[#6b7280]">接口</span>
          <select id="endpoint-filter" class="w-64 rounded-lg border border-[#e5e7eb] bg-white px-3 py-2 text-sm outline-none focus:border-[#2563eb]"></select>
        </label>
        <button id="apply" class="rounded-lg bg-[#2563eb] px-5 py-2 text-sm font-medium text-white hover:bg-[#1d4ed8]">查询</button>
        <span id="range" class="ml-auto pb-2 text-xs text-[#9ca3af]"></span>
      </section>

      <div id="error" class="hidden rounded-xl border border-[#fecaca] bg-[#fee2e2] px-4 py-3 text-sm text-[#dc2626]"></div>

      <section class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
        <div class="rounded-xl border border-[#e5e7eb] bg-white p-5 shadow-sm">
          <span class="block text-xs text-[#6b7280]">调用总量</span>
          <span id="stat-calls" class="mt-1.5 block text-[26px] font-bold leading-tight">0</span>
        </div>
        <div class="rounded-xl border border-[#e5e7eb] bg-white p-5 shadow-sm">
          <span class="block text-xs text-[#6b7280]">成功调用</span>
          <span id="stat-succeeded" class="mt-1.5 block text-[26px] font-bold leading-tight text-[#16a34a]">0</span>
        </div>
        <div class="rounded-xl border border-[#e5e7eb] bg-white p-5 shadow-sm">
          <span class="block text-xs text-[#6b7280]">失败调用</span>
          <span id="stat-failed" class="mt-1.5 block text-[26px] font-bold leading-tight text-[#dc2626]">0</span>
        </div>
        <div class="rounded-xl border border-[#e5e7eb] bg-white p-5 shadow-sm">
          <span class="block text-xs text-[#6b7280]">输入 Token</span>
          <span id="stat-tokens" class="mt-1.5 block text-[26px] font-bold leading-tight">0</span>
        </div>
      </section>

      <section class="rounded-xl border border-[#e5e7eb] bg-white p-6 shadow-sm">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-semibold">调用趋势</h2>
          <span class="text-xs text-[#9ca3af]">按 UTC 日期分桶，仅用于趋势展示</span>
        </div>
        <svg id="chart" class="mt-4 block h-45 w-full" role="img" aria-label="调用趋势折线图"></svg>
        <p class="mt-2 text-xs text-[#6b7280]">
          进行中 <span id="in-progress">0</span> 次 · 计费待确认 <span id="pending">0</span> 笔
        </p>
      </section>

      <section class="rounded-xl border border-[#e5e7eb] bg-white p-6 shadow-sm">
        <h2 class="text-lg font-semibold">调用明细</h2>
        <div class="mt-4 overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-[#f9fafb] text-[13px] text-[#6b7280]">
              <tr>
                <th class="px-3 py-2 font-medium">请求标识</th>
                <th class="px-3 py-2 font-medium">API Key</th>
                <th class="px-3 py-2 font-medium">接口</th>
                <th class="px-3 py-2 font-medium">时间（UTC）</th>
                <th class="px-3 py-2 font-medium">状态</th>
                <th class="px-3 py-2 font-medium">输入 Token</th>
                <th class="px-3 py-2 font-medium">耗时</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="mt-4 flex items-center justify-between text-sm">
          <span id="page-info" class="text-[#6b7280]"></span>
          <span class="flex gap-3">
            <button id="prev" class="rounded-lg border border-[#e5e7eb] px-4 py-1.5 hover:bg-[#f9fafb] disabled:cursor-not-allowed disabled:opacity-40">上一页</button>
            <button id="next" class="rounded-lg border border-[#e5e7eb] px-4 py-1.5 hover:bg-[#f9fafb] disabled:cursor-not-allowed disabled:opacity-40">下一页</button>
            <select id="page-size" class="rounded-lg border border-[#e5e7eb] bg-white px-2 py-1.5 text-sm outline-none focus:border-[#2563eb]" aria-label="每页条数">
              <option value="20">20 条/页</option>
              <option value="50">50 条/页</option>
              <option value="100">100 条/页</option>
            </select>
          </span>
        </div>
      </section>

      <p class="pb-4 text-center text-xs text-[#6b7280]">统计与明细来自服务端同一时间窗口的真实记录，密钥只显示脱敏标识。</p>
    </main>
  </div>
</div>
<script src="/assets/app.js"></script>
</body>
</html>
